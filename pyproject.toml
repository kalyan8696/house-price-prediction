[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-prediction"
version = "1.0.0"
description = "Production-ready House Price Prediction ML System"
authors = [{name = "ML Engineer"}]
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
